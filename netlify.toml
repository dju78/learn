# Separate Netlify site for learn.jomovate.com. Does not alter jomovate.com.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"

# Redirect HTTP to HTTPS, and use the dedicated book page as the site's canonical home.
[[redirects]]
  from = "http://learn.jomovate.com/*"
  to = "https://learn.jomovate.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "https://learn.jomovate.com/power-bi-book/"
  status = 301
  force = true
